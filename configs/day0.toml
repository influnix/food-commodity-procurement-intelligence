# Day 0 design contract. No downloader, model, simulator or optimizer consumes it yet.
schema_version = 1
project_name = "Food Commodity Procurement Intelligence"
seed = 20261024
stage = "design_only"

[data]
commodity_candidate = "wheat"
source_series_name = "TODO_VERIFY_DAY1"
source_unit = "TODO_VERIFY_DAY1"
raw_dir = "data/raw"
interim_dir = "data/interim"
processed_dir = "data/processed"
synthetic_dir = "data/synthetic"
weather_enabled = false
vintage_mode = "latest_vintage_pseudo_real_time"

[decision]
origin = "month_end"
price_publication_lag_months = 1
availability_rule = "observation_month_plus_one_month_end_before_decision"
target_delivery_offsets_months = [1, 2, 3]
steps_from_latest_observation = [2, 3, 4]
replan_every_month = true
contract = "delivery_month_indexed"
shortage_mode = "lost_sales"

[evaluation]
minimum_initial_train_months = 120
validation_origin_months = 36
holdout_target_months = 24
maximum_delivery_offset_months = 3
seasonal_period = 12
interval_quantiles = [0.1, 0.5, 0.9]
development_scenario_seeds = [20261024, 20261025, 20261026]
split_dates_status = "TODO_FREEZE_AFTER_DATA_AUDIT_BEFORE_MODEL_SELECTION"
holdout_state_rule = "common_initial_inventory_and_pipeline"
terminal_rule = "no_salvage_common_target_penalty_no_late_orders"

[simulation]
status = "proposed_synthetic_assumptions_not_calibrated"
quantity_unit = "metric_tonne"
cost_unit = "USD"
price_unit_required = "USD_per_metric_tonne_confirm_before_execution"
demand_forecast_tonnes_per_month = 100.0
demand_log_sigma = 0.10
initial_inventory_tonnes = 200.0
storage_capacity_tonnes = 400.0
holding_usd_per_tonne_month = 3.0
lost_sales_penalty_usd_per_tonne = 1500.0
disposal_usd_per_tonne = 1.0
terminal_inventory_target_tonnes = 200.0
terminal_deviation_penalty_usd_per_tonne = 9.0
maximum_extra_delay_months = 1
fixed_order_tonnes_per_month = 100.0
cvar_alpha = 0.9
risk_lambda = 0.2
evaluation_replications = 100
test_seed_bank_status = "TODO_FREEZE_AND_SEPARATE_FROM_DEVELOPMENT_BEFORE_HOLDOUT"

[simulation.stress]
onset_operating_month_range = [6, 12]
duration_months = 3
price_multiplier = 1.30
demand_multiplier = 1.20
supplier_a_delay_probability = 0.35
supplier_b_delay_probability = 0.15

[[simulation.suppliers]]
supplier_id = "A"
premium_fraction = 0.02
lead_time_months = 2
order_capacity_tonnes_per_month = 80.0
delay_probability = 0.10

[[simulation.suppliers]]
supplier_id = "B"
premium_fraction = 0.08
lead_time_months = 1
order_capacity_tonnes_per_month = 100.0
delay_probability = 0.03
