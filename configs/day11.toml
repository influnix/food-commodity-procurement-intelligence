# Declarative final-evaluation freeze; no real-data execution capability.
schema_version = 1
project_root = ".."
report_root = "artifacts/day11"
synthetic_root = "data/synthetic/day11"
holdout_locked = true
real_execution_enabled = false
split_config = "configs/splits.toml"
policies = ["fixed", "fa_sarimax", "rn_sarimax", "ra_sarimax", "fa_lightgbm", "rn_lightgbm", "ra_lightgbm"]

[calendar]
first_origin = "2024-09"
last_origin = "2026-06"
first_ledger = "2024-10"
last_ledger = "2026-09"
decision_count = 22
ledger_count = 24
active_count = 21
runoff_count = 3
bridge_month = "2024-09"
runoff_new_orders = false

[information]
publication_lag_months = 1
model_steps = [2, 3, 4]
delivery_horizons = [1, 2, 3]
complete_label_rule = "o+3<=t-1_and_all_publication_timestamps<=decision_at(t)"
bridge_target_scoring = false
bridge_history = "only_after_actual_available_at_and_observation_month<=t-1"
sequential_published_prior_targets_allowed_after_separate_authorization = true
initial_oof_seed = "existing_day5_historical60_and_validation36_per_model_filter_by_asof"
fill_unissued_2024_june_to_august_forecasts = false

[rolling]
sarimax_spec = "configs/day4.toml"
lightgbm_spec = "configs/day4.toml"
feature_spec = "configs/day3.toml"
calibration_spec = "configs/day5.toml"
scenario_spec = "configs/day6.toml"
lp_spec = "configs/day7.toml"
cvar_spec = "configs/day8.toml"
refit_every_origin = true
hyperparameter_search = false
calibration_window = 60
minimum_calibration_samples = 24
joint_vector_window = 60
minimum_joint_vectors = 24
scenario_count = 128
alpha = 0.90
rn_lambda = 0.0
ra_lambda = 0.50
planning_seed = 2026102901
evaluation_seed = 2026102902
new_methods_or_seeds = false

[operations]
baseline_config = "configs/day6.toml"
initial_inventory_tonnes = 200.0
initial_pipeline = "empty"
demand_tonnes_per_month = 100.0
realized_extra_delay_months = 0
terminal_target_tonnes = 200.0
terminal_deviation_usd_per_tonne = 9.0
salvage_value = 0.0
terminal_pipeline = "must_be_empty_abort_otherwise"
failure_policy = "abort_incomplete_no_hidden_fallback_no_full_comparison"

[metrics]
primary = ["full_total_simulated_cost_usd", "quantity_fill_rate"]
secondary = ["procurement", "holding", "unmet_cost", "transport", "disposal", "terminal_cost", "unmet_tonnes", "stockout_months", "average_inventory", "supplier_allocation", "active_cost", "runoff_cost", "ending_inventory", "ending_pipeline", "solver_failure", "fallback_count", "paired_monthly_differences"]
cost_and_service_pareto = true
choose_single_winner = false
market_cvar_estimation = false
independent_months_assumed = false

[synthetic]
knowledge_type = "synthetic_preflight_not_world_bank"
fixture_start = "2000-01"
price_rule = "100+2*(monthly_index_since_2000_mod_12)"
warmup_issued_origins = 63
native_estimator_backends = "injected_fakes_no_real_training"
production_readiness_inferred_from_fixture = false
