name: Offline portfolio contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install existing pinned dependencies
        run: |
          python -m pip install -r requirements/day7-lock.txt
          python -m pip install pytest==8.3.5
          python -m pip install --no-deps -e .
      - name: Audit exact tracked release files
        run: python scripts/release/audit.py --tracked
      - name: Run offline toy and contract scope
        run: python scripts/ci/run_contract_tests.py
